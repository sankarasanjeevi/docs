name: Deploy docs to GitHub Pages

# Since 2026-11-08 the docs live on sankarasanjeevi.com/docs (Framer). This site now
# publishes only redirect pages (scripts/redirect-stubs.mjs), one per old address.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write redirect pages
        run: node scripts/redirect-stubs.mjs
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: redirect-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
